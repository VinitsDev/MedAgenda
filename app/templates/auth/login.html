{% extends "base.html" %}

{% block titulo %}Entrar - MedAgenda{% endblock %}

{% block conteudo %}
<div class="card shadow-sm overflow-hidden auth-card mx-auto">
  <div class="row g-0">
    {% include "auth/_lateral.html" %}
    <div class="col-md-7">
      <div class="card-body p-4 p-lg-5">
        <h1 class="h3 mb-1">Bem-vindo de volta</h1>
        <p class="text-muted mb-4">Entre para acompanhar seus agendamentos.</p>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" type="email" id="email" name="email"
                   value="{{ request.form.get('email', '') }}" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label" for="senha">Senha</label>
            <input class="form-control" type="password" id="senha" name="senha" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
        <p class="text-center text-muted mt-4 mb-0">
          Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
