{% extends "base.html" %}

{% block titulo %}Entrar - MedAgenda{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Entrar</h1>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" type="email" id="email" name="email" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="senha">Senha</label>
            <input class="form-control" type="password" id="senha" name="senha" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
