{% extends "base.html" %}

{% block titulo %}{{ titulo }} - MedAgenda{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">{{ titulo }}</h1>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="nome">Nome completo</label>
            <input class="form-control" id="nome" name="nome" maxlength="120"
                   value="{{ valores.get('nome', '') }}" required autofocus>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="cpf">CPF</label>
              <input class="form-control" id="cpf" name="cpf" inputmode="numeric" maxlength="14"
                     value="{{ valores.get('cpf', '')|cpf }}"
                     {% if documentos_editaveis %}required{% else %}readonly{% endif %}>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="data_nascimento">Data de nascimento</label>
              <input class="form-control" type="date" id="data_nascimento" name="data_nascimento"
                     value="{{ valores.get('data_nascimento', '') }}"
                     {% if documentos_editaveis %}required{% else %}readonly{% endif %}>
            </div>
          </div>
          {% if not documentos_editaveis %}
            <div class="form-text mb-3">Para alterar CPF ou data de nascimento, procure a recepção.</div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label" for="telefone">Telefone (opcional)</label>
            <input class="form-control" id="telefone" name="telefone" inputmode="tel" maxlength="20"
                   value="{{ valores.get('telefone', '')|telefone }}">
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Salvar</button>
            <a class="btn btn-outline-secondary" href="{{ cancelar_url }}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
