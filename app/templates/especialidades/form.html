{% extends "base.html" %}

{% block titulo %}{{ titulo }} - MedAgenda{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">{{ titulo }}</h1>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="nome">Nome da especialidade</label>
            <input class="form-control" id="nome" name="nome" maxlength="100"
                   value="{{ valores.get('nome', '') }}" required autofocus>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Salvar</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('especialidades.lista') }}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
